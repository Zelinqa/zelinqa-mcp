<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="An MCP host calls the zelinqa-mcp server over stdio; the server calls the Zelinqa API with the Python SDK and returns question text, choice labels and progress."><rect width="1200" height="460" fill="#FBFAF6"/><rect x="40" y="60" width="280" height="170" rx="14" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><text x="180.0" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2D">MCP host</text><text x="180.0" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">Claude Desktop · Claude Code</text><text x="180.0" y="146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">Cursor · Codex · VS Code</text><text x="180.0" y="168" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">The model sees text, labels, progress</text><rect x="460.0" y="60" width="280" height="170" rx="14" fill="#FFFFFF" stroke="#6B5BD6" stroke-width="3"/><text x="600.0" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2D">zelinqa-mcp</text><text x="600.0" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">stdio, one process per user</text><text x="600.0" y="146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">7 tools · 1 resource · 1 prompt</text><text x="600.0" y="168" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">Hides session and decision IDs</text><rect x="880.0" y="60" width="280" height="170" rx="14" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><text x="1020.0" y="96" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2D">Zelinqa API</text><text x="1020.0" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">api.zelinqa.ai</text><text x="1020.0" y="146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">Runtime key, one published domain</text><text x="1020.0" y="168" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">Chooses the next question</text><line x1="328" y1="120" x2="442.0" y2="120" stroke="#6B5BD6" stroke-width="3"/><polygon points="452.0,120 440.0,113 440.0,127" fill="#6B5BD6"/><text x="390.0" y="106" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#1A1A2D">tool call</text><line x1="452.0" y1="175" x2="338" y2="175" stroke="#2ABB9F" stroke-width="3"/><polygon points="328,175 340,168 340,182" fill="#2ABB9F"/><text x="390.0" y="199" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#1A1A2D">question, choices</text><line x1="748.0" y1="120" x2="862.0" y2="120" stroke="#6B5BD6" stroke-width="3"/><polygon points="872.0,120 860.0,113 860.0,127" fill="#6B5BD6"/><text x="810.0" y="106" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#1A1A2D">Python SDK</text><line x1="872.0" y1="175" x2="758.0" y2="175" stroke="#2ABB9F" stroke-width="3"/>