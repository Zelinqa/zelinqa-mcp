[project]
name = "zelinqa-mcp"
version = "1.0.1"
description = "Official MCP server for the Zelinqa API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zelinqa", email = "support@zelinqa.ai" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["zelinqa", "mcp", "model-context-protocol", "next-best-question"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "zelinqa>=1.0.1,<2",
    # mcp 2.x: the server class is mcp.server.mcpserver.MCPServer and host/port are
    # transport options of run(). The major bound is deliberate.
    "mcp>=2.2,<3",
    # mcp 2.x requires pydantic 2.12 or newer.
    "pydantic>=2.12,<3",
]

[project.urls]
Documentation = "https://docs.zelinqa.ai"
Homepage = "https://zelinqa.ai"
Repository = "https://github.com/Zelinqa/zelinqa-mcp"
Issues = "https://github.com/Zelinqa/zelinqa-mcp/issues"

[project.scripts]
zelinqa-mcp = "zelinqa_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/zelinqa_mcp", "examples", "skills", "README.md", "README.fr.md", "LICENSE", "server.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/zelinqa_mcp"]

# Review-only override until Zelinqa SDK 1.0.1 is published on PyPI.
[tool.uv.sources]
# Exact tested commit, never a moving branch. Remove before MCP publication.
zelinqa = { git = "https://github.com/Zelinqa/zelinqa-sdk.git", rev = "db5d5a4c1f79c07a9338d8dd2dbe074f2d71b76c" }

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
    "twine>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The live suite talks to the real API and is opt-in: ZELINQA_LIVE=1 plus -m live.
addopts = '-ra -q --strict-markers -m "not live"'
markers = ["live: hits the real Zelinqa API, requires ZELINQA_LIVE=1 and live keys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zelinqa_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
