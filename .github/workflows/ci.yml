name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `nbq` resolves from the pinned SDK commit in uv.lock until 1.0.0 is on PyPI (PUBLISHING.md).
      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      # The live suite is excluded by the `-m "not live"` default in pyproject.toml.
      - name: Test
        run: uv run pytest

      - name: Build source and wheel distributions
        run: uv build --out-dir dist

      - name: Validate package metadata and README rendering
        run: uv run twine check dist/*
